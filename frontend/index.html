<!DOCTYPE html>
<html lang="en">
<head>
    <title>Personal Podcast Manager</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="left-nav">
        <h2>Podcast Manager 🎧 </h2>
        <nav>
            <a href="#" class="active">Home</a>
            <a href="#">My Library</a>
            <a href="#">Saved</a>
            <a href="#">Analytics</a><br><br>
            <hr>
            <a href="#">+ Add Podcast<br><br>
                <input type="file">
            </a>         
            <div id="weekly-goal">Weekly Goal 10hrs</div>   
        </nav>        
    </div>

    <main>
        <div class="heading">
            <h2>Welcome to your Podcast Manager! ✨</h2>
            <p>Here's whats happening with your podcasts</p>
            <input type="text" class="search" placeholder="🔍 Search podcasts, episodes..."></div>
        </div>
        
        <div class="grid">
            <div class="card1"><img src="https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvdjkzMi1uaW5nLTUyXzEta2xidW45bzYuanBn.jpg" class="music-icon" alt="Music icon">Total Podcasts</div>
            <div class="card2"><img src="https://assets-v2.lottiefiles.com/a/a87616ae-84de-11ee-9595-0bf0b4b8de5e/jqUqmJYzaH.png" class="streak-icon" alt="streak icon">Streak</div>
            <div class="card3"><img src="https://icon2.cleanpng.com/20180730/wiv/e809bd4fb228a06dfeb4e99f97248992.webp" class="completed-icon" alt="completed icon">Completed</div>
        </div>

        <h2>Continue Listening</h2>
        <h2>Your Saved Podcasts</h2>
    </main>    

    <section class="right">
        <div class="resume">
            <h2>Resume</h2>
        </div>

        <div class="queue">
            <h3>Your Queue</h3>
            <p>View All</p>
        </div>
        
        <img src="https://img.magnific.com/free-photo/beautiful-landscape-painting_23-2151894740.jpg?semt=ais_hybrid&w=740&q=80" class="mountain" alt="mountain">
    </section>
</body>
</html>
